[defaults]
# robertdebock.bootstrap 7.1.7 still reads facts as top-level variables
# (ansible_distribution). Setting this explicitly keeps that working, and quiet,
# until ansible-core 2.24 removes it; our own playbooks use ansible_facts only.
inject_facts_as_vars = True
inventory = inventory.ini
roles_path = roles
remote_user = admin
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# Ansible's default ssh_args plus IdentitiesOnly, so ssh offers only the key
# the playbook names, not every key in the agent (sshd disconnects after a few).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
